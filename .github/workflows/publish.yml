name: Publish

# Releases every packable project to nuget.org when a version tag (v1.2.3, v1.0.0-preview.1) is pushed.
# Steps and one-time setup: docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: CrxMoney.Integrations.slnx

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the NuGet API key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error title=NUGET_API_KEY is not set::Add the repository secret NUGET_API_KEY (a nuget.org key that can push CrxMoney.* packages), then re-run this workflow. See docs/releasing.md."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag not on main::$GITHUB_REF_NAME points at a commit that is not on main. Tag a merged commit."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fixture guard
        run: dotnet run --project build/FixtureGuard --configuration Release -- tests

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release

      - name: Test
        run: >
          dotnet test --solution "$SOLUTION" --configuration Release --no-build
          --results-directory TestResults --results-directory-layout per-module
          --report-xunit-trx --progress off

      - name: Pack
        run: dotnet pack "$SOLUTION" --configuration Release --no-build --output artifacts/packages

      - name: Require package versions to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls artifacts/packages
          mismatched=$(find artifacts/packages -name '*.nupkg' ! -name "*.${version}.nupkg")
          if [ -n "$mismatched" ] || [ -z "$(find artifacts/packages -name "*.${version}.nupkg")" ]; then
            echo "::error title=Version mismatch::Packages were not versioned ${version}: ${mismatched:-none built}. Does the tag point at the checked-out commit?"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # Symbol packages (.snupkg) next to each .nupkg are pushed automatically.
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
